<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta con Código de Acceso</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --accent: #00b894;
            --danger: #d63031;
            --dark: #2d3436;
            --light: #f5f6fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: var(--dark);
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1, h2 {
            margin-top: 0;
            color: var(--dark);
        }
        input {
            padding: 12px;
            font-size: 16px;
            width: 80%;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
        }
        input:focus {
            border-color: var(--primary);
            outline: none;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .hidden {
            display: none !important;
        }
        /* Estilos de la Ruleta */
        .wheel-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
        }
        canvas {
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            background-color: #fff;
        }
        .pointer {
            position: absolute;
            top: -10px;
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 25px solid var(--danger);
            z-index: 10;
        }
        .error-msg {
            color: var(--danger);
            font-size: 14px;
            margin-top: 10px;
        }
        /* Panel Admin flotante */
        .admin-trigger {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            width: auto;
        }
        .admin-panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: left;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .code-list {
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            background: #fafafa;
            border-radius: 6px;
        }
        .code-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #eee;
        }
        .code-item.used {
            color: #999;
            text-decoration: line-through;
        }
    </style>
</head>
<body>

    <!-- VISTA 1: INGRESO DE CÓDIGO -->
    <div id="loginSection" class="card">
        <h2>Acceso a la Ruleta</h2>
        <p>Introduce tu código canjeable para participar:</p>
        <input type="text" id="codeInput" placeholder="Ej: RULETA01">
        <br>
        <button onclick="validarCodigo()">Ingresar</button>
        <div id="errorMsg" class="error-msg"></div>
    </div>

    <!-- VISTA 2: RULETA -->
    <div id="wheelSection" class="card hidden">
        <h2>¡Gira y Gana!</h2>
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheel" width="300" height="300"></canvas>
        </div>
        <button id="spinBtn" style="margin-top: 20px;" onclick="girarRuleta()">Girar Ruleta</button>
    </div>

    <!-- VISTA 3: BLOQUEO POST-USO -->
    <div id="blockedSection" class="card hidden">
        <h2>Código ya utilizado</h2>
        <p>Este código ya fue canjeado o ya realizaste tu giro. Cada código y sesión tiene un único uso.</p>
        <button style="background-color: #666;" onclick="cerrarSesionLocal()">Salir / Cambiar cuenta</button>
    </div>

    <!-- BOTÓN Y PANEL ADMIN -->
    <button class="admin-trigger" onclick="abrirAdmin()">Panel Admin</button>

    <div id="adminModal" class="card hidden" style="position: fixed; z-index: 100;">
        <div class="admin-panel">
            <h3>Panel de Administración</h3>
            <div id="adminLogin">
                <p>Contraseña de Admin:</p>
                <input type="password" id="adminPass" placeholder="Contraseña">
                <button onclick="verificarAdmin()">Entrar</button>
            </div>
            <div id="adminDashboard" class="hidden">
                <p><strong>Generar nuevo código:</strong></p>
                <input type="text" id="newCodeText" placeholder="Código (ej: VIP2026)">
                <button onclick="crearCodigo()">Crear Código</button>
                <p style="margin-top: 15px;"><strong>Lista de Códigos:</strong></p>
                <div class="code-list" id="codeListContainer"></div>
                <button style="background-color: var(--danger); margin-top: 5px;" onclick="cerrarAdmin()">Cerrar Panel</button>
            </div>
        </div>
    </div>

    <script>
        // Inicializar Base de Datos en LocalStorage si no existe
        if (!localStorage.getItem('codigos_ruleta')) {
            const codigosIniciales = {
                "RULETA01": false,
                "PREMIO123": false,
                "VIP2026": false
            };
            localStorage.setItem('codigos_ruleta', JSON.stringify(codigosIniciales));
        }

        // Revisar si el usuario actual ya gastó su giro en esta pestaña/navegador
        window.onload = function() {
            if (sessionStorage.getItem('giro_realizado') === 'true') {
                mostrarSeccion('blockedSection');
            }
        };

        function mostrarSeccion(id) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('wheelSection').classList.add('hidden');
            document.getElementById('blockedSection').classList.add('hidden');
            document.getElementById('adminModal').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');
        }

        let codigoActual = "";

        function validarCodigo() {
            const input = document.getElementById('codeInput').value.trim().toUpperCase();
            const errorDiv = document.getElementById('errorMsg');
            let db = JSON.parse(localStorage.getItem('codigos_ruleta'));

            if (!input) {
                errorDiv.textContent = "Por favor, escribe un código.";
                return;
            }

            if (!(input in db)) {
                errorDiv.textContent = "Código inválido.";
                return;
            }

            if (db[input] === true) {
                errorDiv.textContent = "Este código ya ha sido utilizado.";
                return;
            }

            // Código válido y no usado
            codigoActual = input;
            errorDiv.textContent = "";
            mostrarSeccion('wheelSection');
            drawWheel();
        }

        function cerrarSesionLocal() {
            sessionStorage.clear();
            location.reload();
        }

        // --- LÓGICA DE LA RULETA (20 secciones para 5% de probabilidad del 10% de descuento) ---
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        
        // 1 sola ranura para el 10% de descuento (5% de probabilidad) y el resto repartido entre Rodman y Tyson
        const options = [
            'RODMAN 9,100', 'TYSON 7,000', 'RODMAN 9,100', 'TYSON 7,000',
            'RODMAN 9,100', 'TYSON 7,000', 'RODMAN 9,100', 'TYSON 7,000',
            'RODMAN 9,100', 'TYSON 7,000', 'RODMAN 9,100', 'TYSON 7,000',
            'RODMAN 9,100', 'TYSON 7,000', 'RODMAN 9,100', 'TYSON 7,000',
            'RODMAN 9,100', 'TYSON 7,000', 'RODMAN 9,100', '10% DE DESCUENTO'
        ];
        
        const colors = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#fab1a0', '#a29bfe', '#74b9ff', '#55efc4'];
        let startAngle = 0;
        const arc = Math.PI / (options.length / 2);

        function drawWheel() {
            const outsideRadius = 130;
            const textRadius = 85;
            const center = 150;
            ctx.clearRect(0, 0, 300, 300);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;

            for (let i = 0; i < options.length; i++) {
                const angle = startAngle + i * arc;
                ctx.fillStyle = colors[i % colors.length];
                ctx.beginPath();
                ctx.arc(center, center, outsideRadius, angle, angle + arc, false);
                ctx.arc(center, center, 0, angle + arc, angle, true);
                ctx.stroke();
                ctx.fill();

                ctx.save();
                ctx.fillStyle = '#2d3436';
                ctx.font = 'bold 9px sans-serif';
                ctx.translate(center + Math.cos(angle + arc / 2) * textRadius, center + Math.sin(angle + arc / 2) * textRadius);
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                const text = options[i];
                ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
                ctx.restore();
            }
        }

        let spinTimeout = null;
        let spinAngleStart = 0;
        let spinTime = 0;
        let spinTimeTotal = 0;

        function girarRuleta() {
            document.getElementById('spinBtn').disabled = true;
            
            // Marcar código como usado en la base de datos global y bloquear sesión local
            let db = JSON.parse(localStorage.getItem('codigos_ruleta'));
            db[codigoActual] = true;
            localStorage.setItem('codigos_ruleta', JSON.stringify(db));
            sessionStorage.setItem('giro_realizado', 'true');

            spinAngleStart = Math.random() * 10 + 10;
            spinTime = 0;
            spinTimeTotal = Math.random() * 2000 + 3000;
            rotateWheel();
        }

        function rotateWheel() {
            spinTime += 30;
            if (spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            drawWheel();
            spinTimeout = setTimeout(rotateWheel, 30);
        }

        function stopRotateWheel() {
            clearTimeout(spinTimeout);
            const degrees = startAngle * 180 / Math.PI + 90;
            const arcd = arc * 180 / Math.PI;
            const index = Math.floor((360 - degrees % 360) / arcd);
            alert(`¡Felicidades! Resultado: ${options[index]}`);
            mostrarSeccion('blockedSection');
        }

        function easeOut(t, b, c, d) {
            t /= d;
            t--;
            return c * (t * t * t + 1) + b;
        }

        // --- PANEL ADMIN ---
        function abrirAdmin() {
            document.getElementById('adminModal').classList.remove('hidden');
            document.getElementById('adminLogin').classList.remove('hidden');
            document.getElementById('adminDashboard').classList.add('hidden');
            document.getElementById('adminPass').value = '';
        }

        function cerrarAdmin() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        function verificarAdmin() {
            const pass = document.getElementById('adminPass').value;
            
            if (pass === "TADEOBROSKI123") {
                document.getElementById('adminLogin').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
                actualizarListaCodigos();
            } else {
                alert("Contraseña incorrecta");
            }
        }

        function crearCodigo() {
            const nuevoTxt = document.getElementById('newCodeText').value.trim().toUpperCase();
            if (!nuevoTxt) return;
            let db = JSON.parse(localStorage.getItem('codigos_ruleta'));
            db[nuevoTxt] = false; // false significa no usado
            localStorage.setItem('codigos_ruleta', JSON.stringify(db));
            document.getElementById('newCodeText').value = '';
            actualizarListaCodigos();
        }

        function actualizarListaCodigos() {
            let db = JSON.parse(localStorage.getItem('codigos_ruleta'));
            let container = document.getElementById('codeListContainer');
            container.innerHTML = "";
            for (let codigo in db) {
                let estadoClass = db[codigo] ? "code-item used" : "code-item";
                let estadoTexto = db[codigo] ? "Usado" : "Disponible";
                container.innerHTML += `<div class="${estadoClass}"><span>${codigo}</span> <span><b>${estadoTexto}</b></span></div>`;
            }
        }
    </script>
</body>
</html>
